name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint 2>&1 | tee lint-output.txt
      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-output
          path: lint-output.txt
      - name: Build
        run: npm run build 2>&1 | tee build-output.txt
      - name: Upload build report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.txt
